name: Build
on:
  workflow_dispatch:
  push:
    branches:
    - v*
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: Build
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
    - name: Install Theos
      uses: Randomblock1/theos-action@v1.4
      with:
        theos-dir: ${{ github.workspace }}/theos
        theos-src: https://github.com/theos/theos
        theos-sdks: https://github.com/theos/sdks
        theos-sdks-branch: master
        orion: false
    - name: Run build script
      run: chmod +x ./build.sh && ./build.sh
    - name: Create GitHub Release
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: >
        gh release create "build-${{ github.run_number }}"
        --repo "${{ github.repository }}" --notes "" -t "Build ${{ github.run_number }}"
    - name: Upload packages to GitHub Release
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: >
        gh release upload "build-${{ github.run_number }}"
        --repo "${{ github.repository }}" --clobber
        packages/*.deb packages/*.dylib
